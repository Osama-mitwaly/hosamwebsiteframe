:root {

// ==================== REDUCER ====================
function appReducer(state, action) {
switch (action.type) {
case 'ADD_SECTION': {
const newPages = state.pages.map(page => page.id === state.activePage ? { ...page, sections: [...page.sections, action.payload] } : page);
return { ...state, pages: newPages, selectedSection: action.payload.id };
}
case 'UPDATE_SECTION': {
const newPages = state.pages.map(page => page.id === state.activePage ? { ...page, sections: page.sections.map(s => s.id === action.payload.id ? { ...s, props: { ...s.props, ...action.payload.props } } : s) } : page);
return { ...state, pages: newPages };
}
case 'DELETE_SECTION': {
const newPages = state.pages.map(page => page.id === state.activePage ? { ...page, sections: page.sections.filter(s => s.id !== action.payload) } : page);
return { ...state, pages: newPages, selectedSection: null };
}
case 'REORDER_SECTIONS': {
const newPages = state.pages.map(page => page.id === state.activePage ? { ...page, sections: action.payload } : page);
return { ...state, pages: newPages };
}
case 'SELECT_SECTION': return { ...state, selectedSection: action.payload };
case 'SET_ACTIVE_PAGE': return { ...state, activePage: action.payload, selectedSection: null };
case 'ADD_PAGE': {
const newPage = {
...action.payload,
sections: [],
showTopBar: true,
heroMode: 'standard',
headerTransparency: 0
};
return {
...state,
pages: [...state.pages, newPage],
activePage: newPage.id
};
}
case 'DELETE_PAGE': {
const pagesToDelete = [action.payload, ...state.pages.filter(p => p.parentId === action.payload).map(p => p.id)];
const filteredPages = state.pages.filter(page => !pagesToDelete.includes(page.id));
return {
...state,
pages: filteredPages,
activePage: filteredPages[0]?.id || null
};
}
case 'UPDATE_PAGE_SETTINGS': {
const newPages = state.pages.map(page => page.id === state.activePage ? { ...page, ...action.payload } : page);
return { ...state, pages: newPages };
}
case 'UPDATE_THEME': return { ...state, themeColors: { ...state.themeColors, ...action.payload } };
case 'SAVE_CUSTOM_THEME': return { ...state, savedThemes: [...state.savedThemes, action.payload] };
case 'UPDATE_HEADER': return { ...state, headerSettings: { ...state.headerSettings, ...action.payload } };
case 'UPDATE_NAV_ORDER': {
const newNavItems = action.payload.map(id => state.headerSettings.navItems.find(item => item.id === id) || { id, type: id, label: id, visible: true });
return { ...state, headerSettings: { ...state.headerSettings, navItems: newNavItems, navOrder: action.payload } };
}
case 'UPDATE_NAV_ITEM': {
const newNavItems = state.headerSettings.navItems.map(item => item.id === action.payload.id ? { ...item, ...action.payload.props } : item);
return { ...state, headerSettings: { ...state.headerSettings, navItems: newNavItems } };
}
case 'UPDATE_HOVER_EFFECTS': return { ...state, hoverEffects: { ...state.hoverEffects, ...action.payload } };
case 'SAVE_HISTORY': {
const newHistory = state.history.slice(0, state.historyIndex + 1);
newHistory.push(JSON.stringify({ pages: state.pages, themeColors: state.themeColors, headerSettings: state.headerSettings, hoverEffects: state.hoverEffects }));
return { ...state, history: newHistory.slice(-30), historyIndex: Math.min(newHistory.length - 1, 29) };
}
case 'UNDO': {
if (state.historyIndex > 0) { const prev = JSON.parse(state.history[state.historyIndex - 1]); return { ...state, ...prev, historyIndex: state.historyIndex - 1, selectedSection: null }; }
return state;
}
case 'REDO': {
if (state.historyIndex < state.history.length - 1) { const next = JSON.parse(state.history[state.historyIndex + 1]); return { ...state, ...next, historyIndex: state.historyIndex + 1, selectedSection: null }; }
return state;
}
case 'IMPORT_DATA': return { ...state, pages: action.payload.pages || state.pages, themeColors: action.payload.themeColors || state.themeColors, savedThemes: action.payload.savedThemes || state.savedThemes, headerSettings: action.payload.headerSettings || state.headerSettings, hoverEffects: action.payload.hoverEffects || state.hoverEffects, selectedSection: null };
case 'LOAD_STATE': return { ...state, ...action.payload };
default: return state;
}
}

// ==================== UTILITY FUNCTIONS & TOAST ====================
const generateId = () => `id-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
const fileToBase64 = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);
});

const ToastContext = createContext(null);
const ToastProvider = ({ children }) => {
    const [toasts, setToasts] = useState([]);
    const addToast = (message, type = 'success') => {
        const id = generateId();
        setToasts(prev => [...prev, { id, message, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
    };
    return (
        <ToastContext.Provider value={{ addToast }}>
            {children}
            <div className="fixed bottom-6 right-6 z-[200] flex flex-col gap-2">
                {toasts.map(t => (
                    <div key={t.id} className={`px-4 py-3 rounded-xl shadow-lg text-sm font-bold text-white animate-slide-in-right flex items-center gap-2 ${t.type === 'error' ? 'bg-red-500' : t.type === 'warning' ? 'bg-orange-500' : 'bg-green-500'}`}>
                        <Icon name={t.type === 'error' ? 'X' : 'Check'} size={16} />
                        {t.message}
                    </div>
                ))}
            </div>
        </ToastContext.Provider>
    );
};

// ==================== FLOATING TEXT TOOLBAR ====================
const FloatingToolbar = () => {
const [position, setPosition] = useState({ top: 0, left: 0, show: false });

useEffect(() => {
const handleSelection = () => {
const selection = window.getSelection();
if (selection && selection.rangeCount > 0 && !selection.isCollapsed) {
let node = selection.anchorNode;
let isEditable = false;
while(node && node !== document.body) {
if(node.getAttribute && node.getAttribute('contenteditable') === 'true') { isEditable = true; break; }
node = node.parentNode;
}
if (isEditable) {
const range = selection.getRangeAt(0);
const rect = range.getBoundingClientRect();
setPosition({ show: true, top: rect.top - 45, left: rect.left + (rect.width / 2) });
} else {
setPosition({ show: false, top: 0, left: 0 });
}
} else {
setPosition({ show: false, top: 0, left: 0 });
}
};

document.addEventListener('mouseup', handleSelection);
document.addEventListener('keyup', handleSelection);
return () => { document.removeEventListener('mouseup', handleSelection); document.removeEventListener('keyup', handleSelection); };
}, []);

if (!position.show) return null;

const format = (cmd, value = null) => { document.execCommand(cmd, false, value); };

return (
<div className="fixed z-[100] flex items-center gap-1 bg-gray-900 text-white p-1 rounded-lg shadow-xl" style={{ top: position.top, left: position.left, transform: 'translateX(-50%)' }} onMouseDown={e => e.preventDefault()}>
<button onClick={() => format('bold')} className="p-1.5 hover:bg-gray-700 rounded transition-colors" title="عريض"><Icon name="Bold" size={14}/></button>
<button onClick={() => format('italic')} className="p-1.5 hover:bg-gray-700 rounded transition-colors" title="مائل"><Icon name="Italic" size={14}/></button>
<div className="w-px h-4 bg-gray-700 mx-1"></div>
<label className="p-1.5 hover:bg-gray-700 rounded cursor-pointer transition-colors relative" title="لون النص">
<Icon name="Palette" size={14}/>
<input type="color" onChange={(e) => format('foreColor', e.target.value)} className="absolute opacity-0 w-0 h-0" />
</label>
</div>
);
};

                    <button onClick={onUndo} disabled={!canUndo} className={`p-2 rounded-lg transition-colors ${canUndo ? 'text-gray-600 hover:bg-gray-100' : 'text-gray-300 cursor-not-allowed opacity-50'}`} title="تراجع"><Icon name="Undo" size={18} /></button>
                    <button onClick={onRedo} disabled={!canRedo} className={`p-2 rounded-lg transition-colors ${canRedo ? 'text-gray-600 hover:bg-gray-100' : 'text-gray-300 cursor-not-allowed opacity-50'}`} title="إعادة"><Icon name="Redo" size={18} /></button>
                </div>
                
                <div className="h-8 w-px bg-gray-200"></div>

                <div className="flex items-center gap-1 p-1 rounded-xl bg-gray-100">
                    {[ { id: 'desktop', icon: 'Monitor' }, { id: 'tablet', icon: 'Tablet' }, { id: 'mobile', icon: 'Smartphone' }].map(v => (
                        <button key={v.id} onClick={() => setViewport(v.id)} className={`p-2 rounded-lg transition-all ${viewport === v.id ? 'bg-white shadow-soft text-blue-600' : 'text-gray-500 hover:text-gray-700'}`}><Icon name={v.icon} size={18} /></button>
                    ))}
                    <div className="w-px h-5 bg-gray-300 mx-1"></div>
                    <button onClick={onExport} className="p-2 text-gray-500 hover:text-blue-600 rounded-lg transition-colors" title="تصدير بصيغة JSON"><Icon name="Download" size={18} /></button>
                    <button onClick={() => fileInputRef.current?.click()} className="p-2 text-gray-500 hover:text-blue-600 rounded-lg transition-colors" title="استيراد تصميم"><Icon name="Upload" size={18} /></button>
                    <input ref={fileInputRef} type="file" accept=".json" onChange={onImport} className="hidden" />
                </div>
                
                <div className="h-8 w-px bg-gray-200 mx-1"></div>
                
                <div className="flex items-center gap-2">
                    <button onClick={handlePreview} className="btn-secondary flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium">
                        <Icon name="Eye" size={16} /> معاينة
                    </button>
                    <button onClick={handlePublish} className="btn-primary flex items-center gap-2 px-5 py-2 rounded-xl text-sm font-bold shadow-md hover:shadow-lg">
                        <Icon name="Globe" size={16} /> نشر الموقع
                    </button>
                </div>
            </div>
        </header>
    );
};

// ==================== SIDEBAR COMPONENT ====================
const Sidebar = () => {
    const { state, dispatch } = useContext(AppContext);
    const [activeTab, setActiveTab] = useState('widgets');
    const [newPageName, setNewPageName] = useState('');
    const [showNewPage, setShowNewPage] = useState(false);
    const [isExpanded, setIsExpanded] = useState(true);

    const handleDragStart = (e, widgetType) => {
        e.dataTransfer.setData('widgetType', widgetType);
        e.dataTransfer.effectAllowed = 'copy';
        e.target.classList.add('dragging');
    };
    const handleDragEnd = (e) => { e.target.classList.remove('dragging'); };
    
    const addPage = (parentId = null) => {
        if (newPageName.trim()) {
            dispatch({ type: 'ADD_PAGE', payload: { id: generateId(), name: newPageName, slug: newPageName.toLowerCase().replace(/\s+/g, '-'), parentId: parentId, showTopBar: true, heroMode: 'standard', headerTransparency: 0, sections: [] } });
            setNewPageName(''); setShowNewPage(false); dispatch({ type: 'SAVE_HISTORY' });
        }
    };
    const deletePage = (pageId) => {
        if (window.confirm('هل أنت متأكد من حذف هذه الصفحة نهائياً؟')) {
            if (state.pages.length > 1) { dispatch({ type: 'DELETE_PAGE', payload: pageId }); dispatch({ type: 'SAVE_HISTORY' }); }
        }
    };

    return (
        <aside className={`absolute flex flex-col bg-white/95 backdrop-blur-xl border-gray-200 transition-all duration-500 ease-[cubic-bezier(0.25,1,0.5,1)] z-50 ${isExpanded ? 'w-80 h-full top-0 right-0 border-l shadow-medium rounded-none' : 'w-16 h-[500px] top-1/2 -translate-y-1/2 right-4 rounded-2xl border shadow-xl'}`}>
            
            <button 
                onClick={() => setIsExpanded(!isExpanded)}
                className="absolute top-1/2 -translate-y-1/2 left-0 -translate-x-1/2 z-50 bg-white border border-gray-200 shadow-md rounded-full w-8 h-8 flex items-center justify-center text-blue-600 hover:bg-blue-50 transition-all duration-500 hover:scale-110"
                title={isExpanded ? "طي القائمة" : "فرد القائمة"}
            >
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={`transition-transform duration-500 ${!isExpanded ? 'rotate-180' : ''}`}>
                    <polyline points="15 18 9 12 15 6" />
                </svg>
            </button>

            <div className={`flex transition-all duration-500 ${isExpanded ? 'flex-row border-b border-gray-200 w-full px-2 pt-2' : 'flex-col gap-3 items-center justify-center w-full pt-4'}`}>
                {[ { id: 'widgets', name: 'العناصر', icon: 'Grid' }, { id: 'pages', name: 'الصفحات', icon: 'FileText' }, { id: 'header', name: 'الترويسة', icon: 'Header' }, { id: 'theme', name: 'الثيم', icon: 'Palette' } ].map(tab => (
                    <button
                        key={tab.id}
                        onClick={() => { setActiveTab(tab.id); if (!isExpanded) setIsExpanded(true); }}
                        title={tab.name}
                        className={`flex flex-col items-center justify-center transition-all duration-300 ${
                            isExpanded ? 'flex-1 py-3 gap-1.5' : 'w-11 h-11 rounded-xl shrink-0'
                        } ${
                            activeTab === tab.id
                                ? (isExpanded ? 'text-blue-600 border-b-2 border-blue-500 bg-blue-50/50' : 'text-blue-600 bg-blue-100 shadow-sm')
                                : 'text-gray-500 hover:text-gray-700 hover:bg-gray-50'
                        }`}
                    >
                        <Icon name={tab.icon} size={isExpanded ? 18 : 22} className="shrink-0" />
                        <span className={`text-[11px] font-bold whitespace-nowrap transition-all duration-300 ${isExpanded ? 'opacity-100 max-h-4' : 'opacity-0 max-h-0 overflow-hidden'}`}>{tab.name}</span>
                    </button>
                ))}
            </div>
            
            <div className={`flex-1 overflow-y-auto overflow-x-hidden scrollbar-thin transition-opacity duration-300 ${isExpanded ? 'opacity-100 delay-150 p-4 w-80' : 'opacity-0 pointer-events-none absolute invisible w-0 h-0'}`}>
                {activeTab === 'widgets' && (
                    <div className="space-y-2">
                        <p className="text-xs text-gray-500 mb-3 px-1">اسحب العناصر إلى منطقة العمل</p>
                        {widgetTypes.map(widget => (
                            <div key={widget.id} draggable onDragStart={(e) => handleDragStart(e, widget.id)} onDragEnd={handleDragEnd} className="widget-item flex items-center gap-3 p-3 rounded-xl bg-white border border-gray-200 cursor-grab shadow-soft">
                                <div className="p-2.5 rounded-lg bg-gradient-to-br from-blue-50 to-blue-100 text-blue-600"><Icon name={widget.icon} size={20} /></div>
                                <div className="flex-1"><span className="text-sm font-semibold text-gray-800">{widget.name}</span><p className="text-xs text-gray-500">{widget.description}</p></div>
                            </div>
                        ))}
                    </div>
                )}
                {activeTab === 'pages' && (
                    <div className="space-y-2">
                        {state.pages.map(page => (
                            <div key={page.id} className="relative">
                                <div className={`flex items-center justify-between p-3 rounded-xl cursor-pointer transition-all ${state.activePage === page.id ? 'bg-gradient-to-l from-blue-500 to-blue-600 text-white shadow-medium' : 'bg-white border border-gray-200 hover:border-blue-300 shadow-soft'}`} style={{ marginRight: page.parentId ? '1.5rem' : '0' }} onClick={() => dispatch({ type: 'SET_ACTIVE_PAGE', payload: page.id })}>
                                    <div className="flex items-center gap-3"><Icon name={page.parentId ? "Layers" : "FileText"} size={16} className={page.parentId ? "opacity-70" : ""} /><span className="text-sm font-medium">{page.name}</span></div>
                                    <div className="flex gap-1 items-center">
                                        {!page.parentId && (<button onClick={(e) => { e.stopPropagation(); setNewPageName(''); setShowNewPage({ isSub: true, parentId: page.id }); }} className={`p-1.5 rounded-lg transition-all ${state.activePage === page.id ? 'hover:bg-white/20' : 'hover:bg-blue-50 text-blue-500'}`} title="إضافة صفحة فرعية"><Icon name="Plus" size={14} /></button>)}
                                        {state.pages.length > 1 && (<button onClick={(e) => { e.stopPropagation(); deletePage(page.id); }} className={`p-1.5 rounded-lg transition-all ${state.activePage === page.id ? 'hover:bg-white/20' : 'hover:bg-red-50 text-red-500'}`} title="حذف الصفحة"><Icon name="Trash" size={14} /></button>)}
                                    </div>
                                </div>
                            </div>
                        ))}
                        {showNewPage ? (
                            <div className="mt-3 p-3 rounded-xl bg-white border border-gray-200 shadow-soft animate-fade-scale" style={{ marginRight: showNewPage.isSub ? '1.5rem' : '0' }}>
                                <p className="text-[10px] text-gray-500 mb-2">{showNewPage.isSub ? 'إضافة صفحة فرعية' : 'إضافة صفحة رئيسية جديدة'}</p>
                                <input type="text" value={newPageName} onChange={(e) => setNewPageName(e.target.value)} placeholder="اسم الصفحة..." className="input-field w-full px-3 py-2 rounded-lg text-sm mb-3" autoFocus onKeyDown={(e) => { if (e.key === 'Enter') addPage(showNewPage.parentId); }} />
                                <div className="flex gap-2">
                                    <button onClick={() => addPage(showNewPage.parentId)} className="btn-primary flex-1 py-1.5 rounded-lg text-xs font-medium">حفظ</button>
                                    <button onClick={() => { setShowNewPage(false); setNewPageName(''); }} className="flex-1 py-1.5 rounded-lg text-xs font-medium bg-gray-100 text-gray-700 hover:bg-gray-200">إلغاء</button>
                                </div>
                            </div>
                        ) : (
                            <button onClick={() => setShowNewPage({ isSub: false })} className="w-full flex items-center justify-center gap-2 p-3 mt-2 rounded-xl border-2 border-dashed border-blue-200 text-blue-600 hover:border-blue-400 hover:bg-blue-50 transition-all"><Icon name="Plus" size={16} /><span className="text-xs font-medium">صفحة رئيسية جديدة</span></button>
                        )}
                    </div>
                )}
                {activeTab === 'header' && <HeaderSettings />}
                {activeTab === 'theme' && <ThemeSettings />}
            </div>
        </aside>
    );
};

// ==================== HEADER SETTINGS COMPONENT ====================
const HeaderSettings = () => {
const { state, dispatch } = useContext(AppContext);
const [draggedItemId, setDraggedItemId] = useState(null);
const fileInputRef = useRef(null);
const activePage = state.pages.find(p => p.id === state.activePage);
const handleUpdateLive = (payload) => {
dispatch({ type: 'UPDATE_HEADER', payload });
};
const saveHistory = () => {
dispatch({ type: 'SAVE_HISTORY' });
};
const handleLogoUpload = async (e) => {
const file = e.target.files[0];
if (file) {
const base64Url = await fileToBase64(file);
handleUpdateLive({ logoImage: base64Url });
saveHistory();
}
e.target.value = '';
};
const handleNavDragStart = (e, itemId) => { setDraggedItemId(itemId); e.dataTransfer.effectAllowed = 'move'; };
const handleNavDragOver = (e, targetId) => {
e.preventDefault();
if (draggedItemId && draggedItemId !== targetId) {
const currentOrder = [...state.headerSettings.navOrder];
const draggedIndex = currentOrder.indexOf(draggedItemId);
const targetIndex = currentOrder.indexOf(targetId);
if (draggedIndex !== -1 && targetIndex !== -1) {
currentOrder.splice(draggedIndex, 1);
currentOrder.splice(targetIndex, 0, draggedItemId);
handleUpdateLive({ navOrder: currentOrder });
}
}
};
const handleNavDragEnd = () => { setDraggedItemId(null); saveHistory(); };
const toggleNavItem = (itemId, visible) => { dispatch({ type: 'UPDATE_NAV_ITEM', payload: { id: itemId, props: { visible: !visible } } }); saveHistory(); };
const toggleSocialItem = (linkId, visible) => {
const newLinks = state.headerSettings.socialLinks.map(l => l.id === linkId ? { ...l, visible: !visible } : l);
handleUpdateLive({ socialLinks: newLinks });
saveHistory();
};
const updateSocialUrl = (linkId, url) => {
const newLinks = state.headerSettings.socialLinks.map(l => l.id === linkId ? { ...l, url } : l);
handleUpdateLive({ socialLinks: newLinks });
};
return (
<div className="space-y-4 pb-10">
<div className="p-3 rounded-xl bg-white border border-gray-200 shadow-soft">
<h4 className="font-semibold text-xs text-gray-800 mb-3">إعدادات عرض الصفحة</h4>
<div className="space-y-3">
<div className="flex items-center justify-between">
<span className="text-xs text-gray-600">الشريط العلوي</span>
<button onClick={() => { dispatch({ type: 'UPDATE_PAGE_SETTINGS', payload: { showTopBar: !activePage?.showTopBar } }); saveHistory(); }} className={`toggle-switch w-9 h-5 rounded-full relative ${activePage?.showTopBar ? 'active' : 'bg-gray-200'}`}><span className="toggle-dot absolute top-0.5 right-0.5 w-3.5 h-3.5 rounded-full bg-white shadow"></span></button>
</div>
<div className="space-y-1">
<span className="text-xs text-gray-600">وضع البانر</span>
<div className="grid grid-cols-2 gap-1">
<button onClick={() => { dispatch({ type: 'UPDATE_PAGE_SETTINGS', payload: { heroMode: 'standard' } }); saveHistory(); }} className={`p-1.5 rounded-lg text-[10px] font-medium transition-all ${activePage?.heroMode === 'standard' ? 'bg-blue-500 text-white' : 'bg-gray-100 text-gray-600'}`}>قياسي</button>
<button onClick={() => { dispatch({ type: 'UPDATE_PAGE_SETTINGS', payload: { heroMode: 'immersive' } }); saveHistory(); }} className={`p-1.5 rounded-lg text-[10px] font-medium transition-all ${activePage?.heroMode === 'immersive' ? 'bg-blue-500 text-white' : 'bg-gray-100 text-gray-600'}`}>شامل</button>
</div>
</div>
<div className="space-y-1">
<div className="flex items-center justify-between">
<span className="text-[10px] text-gray-600">الشفافية</span>
<span className="text-[10px] text-blue-600 font-medium">{activePage?.headerTransparency || 0}%</span>
</div>
<input type="range" min="0" max="100" value={activePage?.headerTransparency || 0} onChange={(e) => dispatch({ type: 'UPDATE_PAGE_SETTINGS', payload: { headerTransparency: parseInt(e.target.value) } })} onMouseUp={saveHistory} onTouchEnd={saveHistory} className="w-full h-1.5 rounded-lg appearance-none cursor-pointer slider-track" />
</div>
</div>
</div>
<div className="p-3 rounded-xl bg-white border border-gray-200 shadow-soft">
<h4 className="font-semibold text-xs text-gray-800 mb-3">الشعار</h4>
<div className="space-y-3">
<div>
<label className="text-xs text-gray-500 mb-1 block">رابط أو رفع صورة الشعار</label>
<div className="flex gap-2 items-center w-full">
<input type="text" value={state.headerSettings.logoImage} onChange={(e) => handleUpdateLive({ logoImage: e.target.value })} onBlur={saveHistory} className="input-field flex-1 min-w-0 px-3 py-2 rounded-lg text-sm" placeholder="https://..." />
<button type="button" onClick={() => fileInputRef.current?.click()} className="p-2 bg-blue-50 text-blue-600 rounded-lg border border-blue-200 hover:bg-blue-100 flex items-center justify-center shrink-0" title="رفع صورة الشعار مباشرة">
<Icon name="Upload" size={16} />
</button>
<input ref={fileInputRef} type="file" accept="image/*" onChange={handleLogoUpload} className="hidden" />
</div>
</div>
<input type="text" value={state.headerSettings.logo} onChange={(e) => handleUpdateLive({ logo: e.target.value })} onBlur={saveHistory} className="input-field w-full px-2 py-1 rounded-lg text-sm" placeholder="النص البديل للشعار" />
<SliderWithIdeal label="حجم الشعار" value={state.headerSettings.logoSize} min={20} max={120} ideal={40} onChange={(e) => handleUpdateLive({ logoSize: parseInt(e.target.value) })} onDragEnd={saveHistory} />
<select value={state.headerSettings.logoShape} onChange={(e) => { handleUpdateLive({ logoShape: e.target.value }); saveHistory(); }} className="input-field w-full px-2 py-1 rounded-lg text-[10px]">
<option value="default">الشكل الافتراضي</option>
<option value="circle">دائري</option>
<option value="rounded">منحني الأطراف</option>
<option value="triangle">مثلث</option>
</select>
</div>
</div>
<div className="p-3 rounded-xl bg-white border border-gray-200 shadow-soft">
<h4 className="font-semibold text-xs text-gray-800 mb-3">الشريط العلوي و التواصل</h4>
<div className="space-y-4">
<input type="text" value={state.headerSettings.topBarText} onChange={(e) => handleUpdateLive({ topBarText: e.target.value })} onBlur={saveHistory} className="input-field w-full px-2 py-1.5 rounded-lg text-xs" placeholder="النص الترويجي" />
<div className="space-y-2">
<ColorPickerWithDropper label="لون خلفية الشريط" value={state.headerSettings.topBarBgColor} onChange={(val) => handleUpdateLive({ topBarBgColor: val })} onBlur={saveHistory} />
<ColorPickerWithDropper label="لون النص الترويجي" value={state.headerSettings.topBarTextColor} onChange={(val) => handleUpdateLive({ topBarTextColor: val })} onBlur={saveHistory} />
</div>
<div className="pt-3 border-t border-gray-100">
<label className="text-xs font-semibold text-gray-700 mb-2 block">وسائل التواصل الاجتماعي</label>
<div className="grid grid-cols-2 gap-2 mb-3">
<button onClick={() => { handleUpdateLive({ socialPosition: 'right' }); saveHistory(); }} className={`p-1.5 text-[10px] rounded transition-all ${state.headerSettings.socialPosition === 'right' ? 'bg-blue-500 text-white shadow' : 'bg-gray-100 text-gray-600'}`}>يمين الشريط</button>
<button onClick={() => { handleUpdateLive({ socialPosition: 'left' }); saveHistory(); }} className={`p-1.5 text-[10px] rounded transition-all ${state.headerSettings.socialPosition === 'left' ? 'bg-blue-500 text-white shadow' : 'bg-gray-100 text-gray-600'}`}>يسار الشريط</button>
</div>
<div className="mb-4">
<ColorPickerWithDropper label="لون الأيقونات" value={state.headerSettings.socialColor} onChange={(val) => handleUpdateLive({ socialColor: val })} onBlur={saveHistory} />
</div>
<SliderWithIdeal label="حجم أيقونات التواصل" value={state.headerSettings.socialIconSize || 15} min={10} max={30} ideal={15} onChange={(e) => handleUpdateLive({ socialIconSize: parseInt(e.target.value) })} onDragEnd={saveHistory} />
<div className="grid grid-cols-2 gap-1.5 max-h-48 overflow-y-auto pr-1 scrollbar-thin">
{state.headerSettings.socialLinks.map(link => (
<div key={link.id} className="flex flex-col gap-1 p-1.5 bg-gray-50 rounded border border-gray-100 transition-colors hover:border-blue-200">
<div className="flex items-center justify-between">
<div className="flex items-center gap-1">
<Icon name={link.icon} size={14} className="text-gray-500" />
<span className="text-[9px] text-gray-700 font-medium">{link.name}</span>
</div>
<button onClick={() => toggleSocialItem(link.id, link.visible)} className={`p-0.5 rounded ${link.visible ? 'text-blue-600' : 'text-gray-400'}`}><Icon name={link.visible ? 'Eye' : 'EyeOff'} size={12} /></button>
</div>
{link.visible && <input type="url" value={link.url} onChange={(e) => updateSocialUrl(link.id, e.target.value)} onBlur={saveHistory} placeholder="رابط الحساب..." className="w-full px-1.5 py-0.5 text-[9px] rounded border border-gray-200 mt-1" />}
</div>
))}
</div>
</div>
</div>
</div>
<div className="p-3 rounded-xl bg-white border border-gray-200 shadow-soft">
<div className="flex items-center justify-between border-b border-gray-100 pb-2 mb-3">
<h4 className="font-semibold text-xs text-gray-800">شريط التنقل (Navigation Bar)</h4>
</div>
<div className="space-y-2 mb-4">
<ColorPickerWithDropper label="لون خلفية الشريط" value={state.headerSettings.navBgColor} onChange={(val) => handleUpdateLive({ navBgColor: val })} onBlur={saveHistory} />
<ColorPickerWithDropper label="لون النصوص والأيقونات" value={state.headerSettings.navTextColor} onChange={(val) => handleUpdateLive({ navTextColor: val, navIconColor: val })} onBlur={saveHistory} />
</div>
<SliderWithIdeal label="حجم أيقونات التنقل" value={state.headerSettings.navIconSize || 20} min={16} max={36} ideal={20} onChange={(e) => handleUpdateLive({ navIconSize: parseInt(e.target.value) })} onDragEnd={saveHistory} />
<p className="text-[10px] font-semibold text-gray-700 mb-2 border-t pt-2">ترتيب العناصر (اسحب بحرية)</p>
<div className="space-y-1.5">
{state.headerSettings.navOrder.map(itemId => {
const item = state.headerSettings.navItems.find(i => i.id === itemId);
if (!item) return null;
let iconName = 'Globe';
if(item.type === 'menu') iconName = 'Menu';
if(item.type === 'search') iconName = 'Search';
if(item.type === 'logo') iconName = 'Layers';
if(item.type === 'cart') iconName = 'ShoppingCart';
return (
<div key={item.id} draggable onDragStart={(e) => handleNavDragStart(e, item.id)} onDragOver={(e) => handleNavDragOver(e, item.id)} onDragEnd={handleNavDragEnd} className={`nav-item-drag flex items-center justify-between p-1.5 rounded border border-gray-100 bg-white shadow-sm hover:border-blue-300 ${draggedItemId === item.id ? 'opacity-50 scale-95' : ''}`}>
<div className="flex items-center gap-1.5">
<Icon name="GripVertical" size={12} className="text-gray-300 cursor-grab" />
<div className="w-5 h-5 bg-gray-50 flex items-center justify-center rounded"><Icon name={iconName} size={12} className="text-gray-600" /></div>
<span className="text-[10px] font-medium text-gray-700">{item.label}</span>
</div>
<button onClick={() => toggleNavItem(item.id, item.visible)} className={`p-1 rounded transition-colors ${item.visible ? 'text-blue-600 bg-blue-50' : 'text-gray-400 bg-gray-50'}`}><Icon name={item.visible ? 'Eye' : 'EyeOff'} size={12} /></button>
</div>
);
})}
</div>
</div>
</div>
);
};

// ==================== HERO SECTION COMPONENT المطور بحرية كاملة ====================
const HeroSection = ({ section, isSelected, onSelect, onUpdate }) => {
    const {
        title, subtitle, buttonText, showButton = true, overlay, textColor,
        mediaType = 'image', mediaUrls = ['https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=1920&q=80'],
        contentAlign = 'center', contentPosition = 'center', bannerHeight = 'md',
        titleSize = 48, subtitleSize = 18, titleGutter = 16, subtitleGutter = 32,
        btnColor = '#ffffff', btnTextColor = '#1e293b', btnFontSize = 16, btnPaddingX = 32, btnPaddingY = 14
    } = section.props || {};
    
    const [currentSlide, setCurrentSlide] = useState(0);
    useEffect(() => {
        if (mediaType === 'slider' && mediaUrls && mediaUrls.length > 1) {
            const timer = setInterval(() => {
                setCurrentSlide(prev => (prev + 1) % mediaUrls.length);
            }, 3500);
            return () => clearInterval(timer);
        }
    }, [mediaType, mediaUrls]);

    const alignClasses = { right: 'items-start text-right', center: 'items-center text-center', left: 'items-end text-left' };
    const positionClasses = { top: 'justify-start pt-24', center: 'justify-center', bottom: 'justify-end pb-24' };
    const heightClasses = { sm: 'min-h-[300px]', md: 'min-h-[500px]', lg: 'min-h-[700px]', full: 'min-h-screen' };

    return (
        <div onClick={(e) => { e.stopPropagation(); onSelect(section.id); }} className={`relative w-full ${heightClasses[bannerHeight]} overflow-hidden transition-all cursor-pointer ${isSelected ? 'section-selected' : ''}`}>
            {mediaType === 'video' ? (
                <video autoPlay loop muted playsInline className="absolute inset-0 w-full h-full object-cover">
                    <source src={mediaUrls[0]} type="video/mp4" />
                </video>
            ) : mediaType === 'slider' ? (
                mediaUrls.map((url, i) => (
                    <div key={i} className="absolute inset-0 w-full h-full bg-cover bg-center transition-opacity duration-1000" style={{ backgroundImage: `url(${url})`, opacity: i === currentSlide ? 1 : 0 }}></div>
                ))
            ) : (
                <div className="absolute inset-0 w-full h-full bg-cover bg-center transition-all duration-700" style={{ backgroundImage: `url(${mediaUrls[0] || 'https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=1920&q=80'})` }}></div>
            )}
            <div className="absolute inset-0 bg-black pointer-events-none" style={{ opacity: (overlay !== undefined ? overlay : 40) / 100 }}></div>
            <div className={`relative z-10 flex flex-col h-full w-full ${heightClasses[bannerHeight]} px-8 md:px-16 ${positionClasses[contentPosition]} ${alignClasses[contentAlign]}`}>
                <h1
                    data-placeholder="عنوان البانر الرئيسي"
                    contentEditable suppressContentEditableWarning onBlur={(e) => onUpdate(section.id, { title: e.target.innerText })}
                    className="font-bold max-w-4xl font-display leading-tight"
                    style={{ color: textColor, fontSize: `${titleSize}px`, marginBottom: `${titleGutter}px` }}
                >
                    {title !== undefined ? title : 'اكتشف أفضل المنتجات'}
                </h1>
                <p
                    data-placeholder="أضف وصفاً جذاباً لمنتجك أو خدمتك هنا..."
                    contentEditable suppressContentEditableWarning onBlur={(e) => onUpdate(section.id, { subtitle: e.target.innerText })}
                    className="max-w-2xl leading-relaxed"
                    style={{ color: textColor, fontSize: `${subtitleSize}px`, marginBottom: `${subtitleGutter}px` }}
                >
                    {subtitle !== undefined ? subtitle : 'تسوق الآن واحصل على خصم 30% على طلبك الأول'}
                </p>
                {showButton !== false && (
                    <button 
                        className="rounded-xl font-semibold transition-all hover:scale-105 shadow-lg flex items-center justify-center" 
                        style={{ 
                            backgroundColor: btnColor, 
                            color: btnTextColor, 
                            fontSize: `${btnFontSize}px`, 
                            paddingLeft: `${btnPaddingX}px`, 
                            paddingRight: `${btnPaddingX}px`, 
                            paddingTop: `${btnPaddingY}px`, 
                            paddingBottom: `${btnPaddingY}px` 
                        }}

                        <span data-placeholder="نص الزر" contentEditable suppressContentEditableWarning onBlur={(e) => onUpdate(section.id, { buttonText: e.target.innerText })}>{buttonText !== undefined ? buttonText : 'تسوق الآن'}</span>

// ==================== DRAGGABLE SECTION LIST ====================
const SectionList = ({ sections, selectedSection, onSelect, onUpdate, onReorder, viewport }) => {
    const [draggedId, setDraggedId] = useState(null);
    const [dragOverId, setDragOverId] = useState(null);
    
    const handleDragStart = (e, id) => {
        e.stopPropagation();
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('reorderSectionId', id);
        setTimeout(() => setDraggedId(id), 0);
    };
    
    const handleDragOver = (e, id) => { 
        e.preventDefault(); 
        e.stopPropagation();
        if (draggedId !== id) setDragOverId(id);
    };
    
    const handleDragLeave = () => setDragOverId(null);
    
    const handleDrop = (e, targetId) => {
        e.preventDefault();
        e.stopPropagation();
        setDragOverId(null);
        
        const sourceId = e.dataTransfer.getData('reorderSectionId');
        if (sourceId && sourceId !== targetId) { 
            onReorder(sourceId, targetId); 
        }
        setDraggedId(null);
    };
    
    const handleDragEnd = () => { 
        setDraggedId(null); 
        setDragOverId(null); 
    };
    
    return (
        <div className="flex flex-col w-full pb-20">
            {sections.map((section) => (
                <div
                    key={section.id}
                    draggable
                    onDragStart={(e) => handleDragStart(e, section.id)}
                    onDragOver={(e) => handleDragOver(e, section.id)}
                    onDragLeave={handleDragLeave}
                    onDrop={(e) => handleDrop(e, section.id)}
                    onDragEnd={handleDragEnd}
                    className={`relative group transition-all duration-300 ease-in-out
                        ${draggedId === section.id ? 'opacity-40 scale-[0.98]' : 'opacity-100'} 
                        ${dragOverId === section.id ? 'border-t-4 border-blue-500 rounded-t-xl mt-2' : 'border-t-0 mt-0'}
                    `}
                >
                    <div className={`absolute top-4 left-4 z-50 flex flex-col bg-white shadow-md border border-gray-200 rounded-lg overflow-hidden transition-all ${selectedSection === section.id ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'}`}>
                        <div className="p-2 cursor-grab active:cursor-grabbing hover:bg-gray-50 flex items-center justify-center" title="اسحب من هنا لتغيير الترتيب">
                            <Icon name="GripVertical" size={14} className="text-gray-400" />
                        </div>
                    </div>
                    
                    {draggedId && <div className="absolute inset-0 z-40"></div>}
                    
                    {renderSection(section, selectedSection === section.id, onSelect, onUpdate, viewport)}
                </div>
            ))}
        </div>
    );
};

                return;
            }
            const newSection = { id: generateId(), type: widgetType, props: getInitialPropsForWidget(widgetType) }; 
            dispatch({ type: 'ADD_SECTION', payload: newSection }); 
            dispatch({ type: 'SAVE_HISTORY' }); 
        } 
    };
    
    const handleSelectSection = (sectionId) => dispatch({ type: 'SELECT_SECTION', payload: sectionId });
    const handleUpdateSection = (sectionId, props) => { dispatch({ type: 'UPDATE_SECTION', payload: { id: sectionId, props } }); dispatch({ type: 'SAVE_HISTORY' }); };
    
    const handleSectionReorder = (draggedId, targetId) => {
        const newSections = [...sections];
        const dragIndex = newSections.findIndex(s => s.id === draggedId);
        const targetIndex = newSections.findIndex(s => s.id === targetId);
        if (dragIndex > -1 && targetIndex > -1) {
            const [removed] = newSections.splice(dragIndex, 1);
            newSections.splice(targetIndex, 0, removed);
            dispatch({ type: 'REORDER_SECTIONS', payload: newSections });
            dispatch({ type: 'SAVE_HISTORY' });
        }
    };

    // إعدادات أبعاد المحاكاة المتطورة
    const viewportStyles = {
        desktop: { width: '100%', maxWidth: '1024px', minHeight: 'calc(100vh - 120px)', borderRadius: '16px', margin: '0 auto', boxShadow: '0 10px 40px -10px rgba(0,0,0,0.1)' },
        tablet: { width: '768px', height: '1024px', borderRadius: '24px', border: '12px solid #1e293b', margin: '20px auto', overflowY: 'auto' },
        mobile: { width: '393px', height: '852px', borderRadius: '48px', border: '14px solid #1e293b', margin: '20px auto', overflowY: 'auto', relative: true, boxShadow: '0 25px 50px -12px rgba(0, 0, 0, 0.4)' }
    };

    const hexToRgba = (hex, alpha) => { let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16); return `rgba(${r}, ${g}, ${b}, ${alpha})`; };
    const headerAlpha = 1 - (headerTransparency / 100);
    const topBarBg = isImmersive ? hexToRgba(state.headerSettings.topBarBgColor, headerAlpha) : state.headerSettings.topBarBgColor;
    const navBarBg = isImmersive ? hexToRgba(state.headerSettings.navBgColor, headerAlpha) : state.headerSettings.navBgColor;
    const navIconColor = state.headerSettings.navIconColor || state.headerSettings.navTextColor;

    return (
        <div 
            className="flex-1 w-full overflow-y-auto overflow-x-hidden canvas-bg p-6 flex scrollbar-thin pb-32" 
            onClick={() => dispatch({ type: 'SELECT_SECTION', payload: null })}
            style={{ '--accent': state.themeColors.primary, '--accent-dark': state.themeColors.secondary, '--accent-light': state.themeColors.accent, fontFamily: state.themeColors.fontFamily || 'Cairo' }}
        >
            <div 
                ref={canvasRef} 
                className="bg-white h-max mb-12 overflow-hidden transition-all duration-300 relative flex flex-col shrink-0 mx-auto" 
                style={viewportStyles[viewport]} 
                onDragOver={handleDragOver} 
                onDragLeave={handleDragLeave} 
                onDrop={handleDrop}
            >
                {/* إضافة نوتش جزيرة تفاعلية فقط في وضع الهاتف */}
                {viewport === 'mobile' && (
                    <>
                        <div className="absolute top-2 left-1/2 -translate-x-1/2 w-28 h-6 bg-[#1e293b] rounded-full z-[110] pointer-events-none flex items-center justify-center">
                            <div className="w-2 h-2 rounded-full bg-[#0f172a] ml-12"></div>
                        </div>
                        <div className="absolute bottom-1 left-1/2 -translate-x-1/2 w-32 h-1 bg-[#1e293b] rounded-full z-[110] pointer-events-none"></div>
                    </>
                )}

                <div className={isImmersive ? 'header-immersive w-full' : 'w-full shrink-0'}>
                    {activePage?.showTopBar && state.headerSettings.topBarVisible && (
                        <div className="py-2 px-4 flex items-center justify-between text-xs font-medium transition-all" style={{ backgroundColor: topBarBg, color: state.headerSettings.topBarTextColor }}>
                            <div className={`flex items-center gap-3 ${state.headerSettings.socialPosition === 'right' ? 'order-1' : 'order-3'}`}>
                                {state.headerSettings.socialLinks.map(link => link.visible && link.url && (
                                    <a key={link.id} href={link.url} target="_blank" rel="noreferrer" style={{ color: state.headerSettings.socialColor }}><Icon name={link.icon} size={state.headerSettings.socialIconSize || 15} /></a>
                                ))}
                            </div>
                            <div className="flex-1 text-center order-2 px-4">{state.headerSettings.topBarText}</div>
                        </div>
                    )}
                    
                    <nav className="py-3 px-6 flex items-center w-full transition-all gap-4" style={{ backgroundColor: navBarBg, color: state.headerSettings.navTextColor, borderBottom: activePage?.headerTransparency > 20 ? 'none' : '1px solid rgba(226, 232, 240, 0.5)' }}>
                        {state.headerSettings.navOrder.map(itemId => {
                            const item = state.headerSettings.navItems.find(i => i.id === itemId);
                            if (!item || !item.visible) return null;
                            if (item.type === 'logo') return (
                                <div key={item.id} className="flex items-center gap-2 mx-auto shrink-0">
                                    {state.headerSettings.logoImage && <img src={state.headerSettings.logoImage} alt="Logo" style={{ height: `${state.headerSettings.logoSize}px` }} className="object-contain" />}
                                    {state.headerSettings.showLogoText && <span className="font-bold font-display text-lg" style={{ color: state.themeColors.primary }}>{state.headerSettings.logo}</span>}
                                </div>
                            );
                            if (item.type === 'menu' || item.type === 'search') return <button key={item.id} style={{ color: navIconColor }}><Icon name={item.type === 'menu' ? 'Menu' : 'Search'} size={state.headerSettings.navIconSize || 20} /></button>;
                            if (item.type === 'cart') return <button key={item.id} className="relative" style={{ color: navIconColor }}><Icon name="ShoppingCart" size={state.headerSettings.navIconSize || 20} />{item.count > 0 && <span className="absolute -top-1 -left-1 w-4 h-4 rounded-full text-white text-[9px] flex items-center justify-center font-bold" style={{ backgroundColor: state.themeColors.primary }}>{item.count}</span>}</button>;
                            if (item.type === 'language') return <div key={item.id} className="text-xs font-bold border rounded-full px-2 py-0.5 opacity-80" style={{ borderColor: `${navIconColor}40`, color: navIconColor }}>العربية</div>;
                            return null;
                        })}
                    </nav>
                </div>
                
                <div className={`relative flex-1 flex flex-col ${isImmersive && !heroSection ? 'pt-0' : ''}`}>
                    {sections.length === 0 ? (
                        <div className="flex flex-col items-center justify-center py-32 text-gray-400 flex-1">
                            <div className="p-6 rounded-2xl bg-gradient-to-br from-blue-50 to-blue-100 mb-6"><Icon name="Layers" size={48} className="text-blue-400" /></div>
                            <p className="text-lg font-medium text-gray-600 mb-2">ابدأ ببناء صفحتك</p>
                            <p className="text-sm text-gray-400">اسحب العناصر من القائمة الجانبية</p>
                        </div>
                    ) : (
                        <>
                            {heroSection && <div style={isImmersive ? { marginTop: '0' } : {}}>{renderSection(heroSection, state.selectedSection === heroSection.id, handleSelectSection, handleUpdateSection, viewport)}</div>}
                            {movableSections.map(section => (
                                <div key={section.id} className="w-full">
                                    {renderSection(section, state.selectedSection === section.id, handleSelectSection, handleUpdateSection, viewport)}
                                </div>
                            ))}
                            {footerSection && <div className="mt-auto">{renderSection(footerSection, state.selectedSection === footerSection.id, handleSelectSection, handleUpdateSection, viewport)}</div>}
                        </>
                    )}
                </div>
            </div>
        </div>
    );
};

// ==================== PUBLIC STORE VIEW COMPONENT ====================
// هذا المكون يعرض المتجر الإلكتروني كاملاً للمستخدم النهائي بدون الـ Editor
const PublicStoreView = () => {
    const [storeState, setStoreState] = useState(null);
    const [loading, setLoading] = useState(true);

   useEffect(() => {
        // جلب البيانات المشفرة القادمة من رابط الـ URL مباشرة
        const urlParams = new URLSearchParams(window.location.search);
        const encodedData = urlParams.get('data');
        
        if (encodedData) {
            try {
                // فك تشفير البيانات وإعادتها لأصلها العربي السليم
                const decodedJson = decodeURIComponent(atob(encodedData));
                setStoreState(JSON.parse(decodedJson));
            } catch (e) {
                console.error("خطأ في فك تشفير بيانات الرابط", e);
                // محاولة برمجية احتياطية من الذاكرة المحلية إذا فشل الرابط
                const localData = localStorage.getItem('storeBuilderPreviewState');
                if (localData) setStoreState(JSON.parse(localData));
            }
        } else {
            // إذا فتحت الرابط القديم بدون بيانات، سيحاول القراءة من الذاكرة المحلية
            const localData = localStorage.getItem('storeBuilderPreviewState');
            if (localData) setStoreState(JSON.parse(localData));
        }
        setLoading(false);
    }, []);

    if (loading) return <div className="h-screen w-full flex items-center justify-center bg-gray-50 font-bold">جاري تحميل المعاينة...</div>;
    if (!storeState) return <div className="h-screen w-full flex items-center justify-center bg-gray-50 text-red-500 font-bold">لم يتم العثور على بيانات للتصميم، يرجى تشغيل المعاينة من داخل الـ Editor أولاً.</div>;

    const activePage = storeState.pages.find(p => p.id === storeState.activePage) || storeState.pages[0];
    const sections = activePage?.sections || [];
    const isImmersive = activePage?.heroMode === 'immersive';
    const headerTransparency = activePage?.headerTransparency || 0;

    const heroSection = sections.find(s => s.type === 'hero');
    const footerSection = sections.find(s => s.type === 'footer');
    const movableSections = sections.filter(s => s.type !== 'hero' && s.type !== 'footer');

    // دوال وتقنيات العرض النظيف (بدون سحب وإفلات أو تعديل نصوص)
    const hexToRgba = (hex, alpha) => { let r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16); return `rgba(${r}, ${g}, ${b}, ${alpha})`; };
    const headerAlpha = 1 - (headerTransparency / 100);
    const topBarBg = isImmersive ? hexToRgba(storeState.headerSettings.topBarBgColor, headerAlpha) : storeState.headerSettings.topBarBgColor;
    const navBarBg = isImmersive ? hexToRgba(storeState.headerSettings.navBgColor, headerAlpha) : storeState.headerSettings.navBgColor;
    const navIconColor = storeState.headerSettings.navIconColor || storeState.headerSettings.navTextColor;

    const renderStaticSection = (section) => {
        // تمرير خصائص وهمية لإيقاف تفعيل الـ contentEditable والسحب
        const props = { section, isSelected: false, onSelect: () => {}, onUpdate: () => {}, viewport: 'desktop' };
        switch (section.type) {
            case 'hero': return <HeroSection {...props} />;
            case 'products': return <ProductsSection {...props} />;
            case 'categories': return <CategoriesSection {...props} />;
            case 'banner': return <BannerSection {...props} />;
            case 'features': return <FeaturesSection {...props} />;
            case 'newsletter': return <NewsletterSection {...props} />;
            case 'footer': return <FooterSection {...props} />;
            default: return null;
        }
    };

    return (
        <div className="min-h-screen w-full bg-white flex flex-col overflow-x-hidden" style={{ '--accent': storeState.themeColors.primary, '--accent-dark': storeState.themeColors.secondary, '--accent-light': storeState.themeColors.accent, fontFamily: storeState.themeColors.fontFamily || 'Cairo' }}>
            
            {/* الترويسة النظيفة */}
            <div className={isImmersive ? 'absolute top-0 left-0 right-0 z-50 w-full' : 'w-full shrink-0'}>
                {activePage?.showTopBar && storeState.headerSettings.topBarVisible && (
                    <div className="py-2 px-6 flex items-center justify-between text-xs font-medium" style={{ backgroundColor: topBarBg, color: storeState.headerSettings.topBarTextColor }}>
                        <div className={`flex items-center gap-3 ${storeState.headerSettings.socialPosition === 'right' ? 'order-1' : 'order-3'}`}>
                            {storeState.headerSettings.socialLinks.map(link => link.visible && link.url && (
                                <a key={link.id} href={link.url} target="_blank" rel="noreferrer" style={{ color: storeState.headerSettings.socialColor }}><Icon name={link.icon} size={storeState.headerSettings.socialIconSize || 15} /></a>
                            ))}
                        </div>
                        <div className="flex-1 text-center order-2 px-4">{storeState.headerSettings.topBarText}</div>
                        <div className="w-px order-2"></div>
                    </div>
                )}
                <nav className="py-4 px-8 flex items-center w-full gap-4" style={{ backgroundColor: navBarBg, color: storeState.headerSettings.navTextColor, borderBottom: activePage?.headerTransparency > 20 ? 'none' : '1px solid rgba(226, 232, 240, 0.5)' }}>
                    {storeState.headerSettings.navOrder.map(itemId => {
                        const item = storeState.headerSettings.navItems.find(i => i.id === itemId);
                        if (!item || !item.visible) return null;
                        if (item.type === 'logo') return (
                            <div key={item.id} className="flex items-center gap-2 mx-auto shrink-0">
                                {storeState.headerSettings.logoImage && <img src={storeState.headerSettings.logoImage} alt="Logo" style={{ height: `${storeState.headerSettings.logoSize}px` }} className="object-contain" />}
                                {storeState.headerSettings.showLogoText && <span className="font-bold font-display text-lg" style={{ color: storeState.themeColors.primary }}>{storeState.headerSettings.logo}</span>}
                            </div>
                        );
                        if (item.type === 'menu' || item.type === 'search') return <button key={item.id} style={{ color: navIconColor }}><Icon name={item.type === 'menu' ? 'Menu' : 'Search'} size={storeState.headerSettings.navIconSize || 20} /></button>;
                        if (item.type === 'cart') return <button key={item.id} className="relative" style={{ color: navIconColor }}><Icon name="ShoppingCart" size={storeState.headerSettings.navIconSize || 20} />{item.count > 0 && <span className="absolute -top-1 -left-1 w-4 h-4 rounded-full text-white text-[9px] flex items-center justify-center font-bold" style={{ backgroundColor: storeState.themeColors.primary }}>{item.count}</span>}</button>;
                        if (item.type === 'language') return <div key={item.id} className="text-xs font-bold border rounded-full px-2 py-0.5 opacity-80" style={{ borderColor: `${navIconColor}40`, color: navIconColor }}>العربية</div>;
                        return null;
                    })}
                </nav>
            </div>

            {/* الأقسام والمحتوى النظيف */}
            <div className="flex-1 flex flex-col w-full">
                {heroSection && <div style={isImmersive ? { marginTop: '0' } : {}}>{renderStaticSection(heroSection)}</div>}
                {movableSections.map(section => (
                    <div key={section.id} className="w-full">
                        {renderStaticSection(section)}
                    </div>
                ))}
                {footerSection && <div className="mt-auto">{renderStaticSection(footerSection)}</div>}
            </div>
        </div>
    );
};

// ==================== MAIN APP CONTENT ====================
const MainAppContent = () => {
    const [state, dispatch] = useReducer(appReducer, initialState);
    const [viewport, setViewport] = useState('desktop');
    const [autoSaveStatus, setAutoSaveStatus] = useState('saved');
    const { addToast } = useContext(ToastContext);
    
    useEffect(() => {
        const saveTimeout = setTimeout(() => {
            try {
                localStorage.setItem('storeBuilderProState', JSON.stringify({ pages: state.pages, activePage: state.activePage, headerSettings: state.headerSettings, themeColors: state.themeColors, hoverEffects: state.hoverEffects }));
                setAutoSaveStatus('saved');
            } catch (e) {
                addToast('فشل الحفظ: المساحة ممتلئة.', 'error');
                setAutoSaveStatus('error');
            }
        }, 800);
        setAutoSaveStatus('saving');
        return () => clearTimeout(saveTimeout);
    }, [state, addToast]);
    
    useEffect(() => {
        const saved = localStorage.getItem('storeBuilderProState');
        if (saved) { try { const parsed = JSON.parse(saved); dispatch({ type: 'LOAD_STATE', payload: parsed }); } catch (e) { console.error('Failed to load:', e); } }
        dispatch({ type: 'SAVE_HISTORY' });
    }, []);
    
    const handleExport = () => { 
        try {
            const data = { pages: state.pages, headerSettings: state.headerSettings, themeColors: state.themeColors, hoverEffects: state.hoverEffects, exportDate: new Date().toISOString() }; 
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }); 
            const url = URL.createObjectURL(blob); 
            const a = document.createElement('a'); a.href = url; a.download = `store-design-${Date.now()}.json`; a.click(); URL.revokeObjectURL(url); 
            addToast('تم تصدير التصميم بنجاح!', 'success');
        } catch(e) {
            addToast('حدث خطأ أثناء التصدير.', 'error');
        }
    };
    
    const handleImport = (e) => { 
        const file = e.target.files[0]; 
        if (file) { 
            const reader = new FileReader(); 
            reader.onload = (event) => { 
                try { 
                    const data = JSON.parse(event.target.result); 
                    dispatch({ type: 'IMPORT_DATA', payload: data }); 
                    dispatch({ type: 'SAVE_HISTORY' }); 
                    addToast('تم استيراد التصميم بنجاح!', 'success');
                } catch (err) { 
                    addToast('خطأ: الملف غير صالح أو تالف.', 'error'); 
                } 
            }; 
            reader.readAsText(file); 
        } 
        e.target.value = ''; 
    };
    
    const handleUndo = () => dispatch({ type: 'UNDO' });
    const handleRedo = () => dispatch({ type: 'REDO' });
    
    const canUndo = state.historyIndex > 0;
    const canRedo = state.historyIndex < state.history.length - 1;
    
    return (
        <AppContext.Provider value={{ state, dispatch }}>
            <div className="h-screen w-full flex flex-col overflow-hidden relative bg-gray-50" style={{ fontFamily: state.themeColors.fontFamily || 'Cairo' }}>
                <FloatingToolbar />
                <TopToolbar viewport={viewport} setViewport={setViewport} onUndo={handleUndo} onRedo={handleRedo} canUndo={canUndo} canRedo={canRedo} onExport={handleExport} onImport={handleImport} autoSaveStatus={autoSaveStatus} />
                
                <div className="fixed top-16 right-0 bottom-0 z-40 pointer-events-none w-80">
                    <div className="pointer-events-auto h-full w-full relative">
                        <Sidebar />
                    </div>
                </div>
                
                <div className="fixed top-16 left-0 bottom-0 z-40 pointer-events-none">
                    <div className="pointer-events-auto h-full w-full">
                        {state.selectedSection && <SettingsPanel viewport={viewport} />}
                    </div>
                </div>
                
                <div className="flex-1 w-full pt-16 relative z-0 flex overflow-hidden">
                    <Canvas viewport={viewport} />
                </div>
            </div>
        </AppContext.Provider>
    );
};

// ==================== APP ROUTER SELECTOR ====================
const App = () => {
    // فحص الرابط الحالي إذا كان يحمل طلب المعاينة الخارجية المباشرة
    const urlParams = new URLSearchParams(window.location.search);
    const isPreviewMode = urlParams.get('preview') === 'true';

    if (isPreviewMode) {
        // تشغيل واجهة المتجر الحرة والنظيفة تماماً
        return <PublicStoreView />;
    }

    // تشغيل نظام الـ Editor الكامل مع الـ Toast المعتاد
    return (
        <ToastProvider>
            <MainAppContent />
        </ToastProvider>
    );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
